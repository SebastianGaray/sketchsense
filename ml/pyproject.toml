[project]
name = "sketchsense"
version = "1.0.0"
description = "Deterministic ML pipeline for SketchSense"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.23", "numpy>=2.5.2,<3"]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]
baseline = ["pillow>=11.0", "scikit-learn>=1.6"]
ml = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.5", "torch>=2.6"]

[project.scripts]
sketchsense = "sketchsense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sketchsense"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
