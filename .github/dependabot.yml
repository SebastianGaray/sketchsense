version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups: { node-dependencies: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups: { web-dependencies: { patterns: ['*'] } }
  - package-ecosystem: uv
    directory: /ml
    schedule: { interval: weekly }
    groups: { python-dependencies: { patterns: ['*'] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
