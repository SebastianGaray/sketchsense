name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: uv sync --project ml --frozen --group dev --group baseline --group ml
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: uv run --project ml --group baseline --group ml ruff check ml
      - run: uv run --project ml --group baseline --group ml ruff format --check ml
      - run: uv run --project ml --group baseline --group ml pyright
      - run: uv run --project ml --group baseline --group ml pytest
      - run: uv run --project ml --group baseline --group ml sketchsense preprocessing-validate
      - run: uv run --project ml --group baseline --group ml sketchsense artifacts-validate
      - run: uv run --project ml --group baseline --group ml pip-audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run audit
      - run: npm run build
      - run: npm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
